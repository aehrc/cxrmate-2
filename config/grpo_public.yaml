defaults:
  - sft_public@_global_
  - _self_

num_nodes: 1

stages_module: stages_cxrmate2_grpo.py

other_exp_dir: experiments/cxrmate2/sft_public

completions_top_k: 0
completions_top_p: 1.0
completions_temperature: 1.0

num_epochs: 2

reward_weights: [0.3, 0.3, 0.3, 0.1]

max_train_prompt_len: 1024

# https://theflyingbirds.in/blog/grpo-group-relative-policy-optimization-tutorial
group_size: 4  # Higher → Better baseline estimate.
beta: 0.04  # Higher → Less policy drift.
epsilon: 0.2  # Higher → More conservative updates.
iterations: 3

train_mbatch_size: 1
val_mbatch_size: 1
test_mbatch_size: 1

validate_check_interval: 0.2

optimiser_kwargs:
  lr: 1e-6
  amsgrad: False
  betas: [0.9, 0.999]
  eps: 1e-08
  weight_decay: 0.01
num_cycles: null

log_loss_every_n_steps: 10
